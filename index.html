<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Komorebi</title>
  <style>
    :root {
      --bg: #111111;
      --card-bg: rgba(25, 25, 30, 0.6);
      --text: #ffffff;
      --accent: #ff3366; /* Цвет центральной линии */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    
    body { 
      background-color: var(--bg);
      background-image: url('cd1fc87324216a811b0e6dfa2b41be41.jpg'); 
      background-size: cover;
      background-position: center;
      color: var(--text); 
      display: flex; 
      flex-direction: column; 
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding-top: 50px;
      backdrop-filter: blur(8px); /* Легкое размытие, чтобы текст читался лучше */
    }

    /* Рулетка */
    .roulette-wrapper {
      position: relative;
      width: 100%;
      height: 120px;
      background: var(--card-bg);
      border-top: 1px solid rgba(255,255,255,0.1);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      overflow: hidden;
      display: flex;
      align-items: center;
    }

    .selector-line {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--accent);
      z-index: 10;
      box-shadow: 0 0 10px var(--accent);
      transform: translateX(-50%);
    }

    .track {
      display: flex;
      gap: 10px;
      transition: transform 5s cubic-bezier(0.1, 0.9, 0.2, 1);
      /* Сдвигаем влево для старта, чтобы крутилось слева направо */
      transform: translateX(-5000px);
    }

    .item {
      min-width: 140px;
      height: 90px;
      background: rgba(40, 40, 45, 0.8);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 500;
      text-align: center;
      padding: 10px;
      flex-shrink: 0;
    }

    .controls {
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    button {
      background: rgba(255, 255, 255, 0.9);
      color: #000000;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
    }
    
    button:active { transform: scale(0.97); }

    /* Панель добавления наград */
    .edit-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: auto;
      padding: 20px;
      background: rgba(0, 0, 0, 0.4);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
    }

    input {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 14px;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
    }
    
    input::placeholder {
      color: rgba(255,255,255,0.5);
    }

    .reward-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .reward-tag {
      background: rgba(255,255,255,0.15);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: flex;
      gap: 8px;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="app-container">
    
    <div class="roulette-wrapper">
      <div class="selector-line"></div>
      <div class="track" id="track"></div>
    </div>

    <div class="controls">
      <button id="spinBtn">Открыть кейс</button>
      <div id="resultText" style="text-align:center; font-size: 1.2rem; min-height: 28px; text-shadow: 0 2px 4px rgba(0,0,0,0.8);"></div>
    </div>

    <div class="edit-panel">
      <div style="font-size: 0.9rem; color: #ccc;">Мои награды:</div>
      <div class="reward-list" id="rewardList"></div>
      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <input type="text" id="newReward" placeholder="Новая награда..." style="flex:1;">
        <button id="addBtn" style="padding: 14px 20px;">+</button>
      </div>
    </div>

  </div>

  <script>
    let rewards = JSON.parse(localStorage.getItem('my_loot')) || ["Вкусняшка", "Отдых", "Массаж", "Новая шмотка"];
    const track = document.getElementById('track');
    const itemWidth = 150; // 140px width + 10px gap
    let isSpinning = false;
    let currentPos = -5000; 

    function renderTags() {
      document.getElementById('rewardList').innerHTML = rewards.map((r, i) => 
        `<div class="reward-tag">${r} <span style="color:#ff4444; cursor:pointer;" onclick="removeReward(${i})">✕</span></div>`
      ).join('');
    }

    function removeReward(index) {
      if(rewards.length < 2) return;
      rewards.splice(index, 1);
      localStorage.setItem('my_loot', JSON.stringify(rewards));
      renderTags();
    }

    document.getElementById('addBtn').onclick = () => {
      const val = document.getElementById('newReward').value.trim();
      if(val) {
        rewards.push(val);
        localStorage.setItem('my_loot', JSON.stringify(rewards));
        document.getElementById('newReward').value = '';
        renderTags();
      }
    };

    document.getElementById('spinBtn').onclick = () => {
      if(isSpinning || rewards.length < 2) return;
      isSpinning = true;
      document.getElementById('resultText').innerText = '';

      // Генерируем временную ленту
      let stripHTML = '';
      const totalItems = 60;
      const targetIndex = 50; 
      const winner = rewards[Math.floor(Math.random() * rewards.length)];

      for(let i = 0; i < totalItems; i++) {
        let text = (i === targetIndex) ? winner : rewards[Math.floor(Math.random() * rewards.length)];
        stripHTML += `<div class="item">${text}</div>`;
      }
      track.innerHTML = stripHTML;

      // Сбрасываем позицию влево
      track.style.transition = 'none';
      track.style.transform = `translateX(-6000px)`;
      
      // Крутим
      setTimeout(() => {
        const screenCenter = window.innerWidth / 2;
        const targetOffset = -(targetIndex * itemWidth) + screenCenter - (140 / 2); 
        
        track.style.transition = 'transform 5s cubic-bezier(0.1, 0.9, 0.2, 1)';
        track.style.transform = `translateX(${targetOffset}px)`;

        setTimeout(() => {
          document.getElementById('resultText').innerText = `Выпало: ${winner}`;
          isSpinning = false;
        }, 5100);
      }, 50);
    };

    renderTags();
  </script>
</body>
</html>
